name: ReabilitaCare CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Build, tests, OpenAPI and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configure Java 21
        # actions/setup-java v6.3.0
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Docker for PostgreSQL Testcontainers
        run: docker info

      - name: Run Checkstyle, unit and integration tests, OpenAPI validation, and JaCoCo
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Summarize JaCoCo line coverage
        if: always() && hashFiles('target/site/jacoco/jacoco.xml') != ''
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("target/site/jacoco/jacoco.xml")
          root = ET.parse(report).getroot()
          line_counter = next(
              counter for counter in root.findall("counter")
              if counter.attrib["type"] == "LINE"
          )
          covered = int(line_counter.attrib["covered"])
          missed = int(line_counter.attrib["missed"])
          total = covered + missed
          percentage = covered / total * 100 if total else 0
          summary = (
              "### JaCoCo line coverage\n\n"
              f"- **Coverage:** {percentage:.2f}% ({covered}/{total} lines)\n"
              "- **Minimum gate:** 70% (enforced by Maven JaCoCo check)\n"
          )

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(summary)
          print(summary)
          PY

      - name: Upload JaCoCo XML and HTML reports
        if: always() && hashFiles('target/site/jacoco/jacoco.xml') != ''
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: error
          retention-days: 14
