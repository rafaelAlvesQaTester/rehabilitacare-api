name: ReabilitaCare CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Build, tests, OpenAPI and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configure Java 21
        # actions/setup-java v6.3.0
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Docker for PostgreSQL Testcontainers
        run: docker info

      - name: Run Checkstyle, unit and integration tests, OpenAPI validation, and JaCoCo
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify
